  <style>
    /* ==========================================================================
       UNIFIED VINTAGE EDITORIAL DESIGN TOKENS (OATMEAL CREAM & CRIMSON RED)
       ========================================================================== */
    :root {
      --color-maastricht-rgb: 34 28 26;
      --color-prussian-rgb: 184 50 39;  /* #B83227 Crimson Red */
      --color-steel-rgb: 184 50 39;
      --color-skysoft-rgb: 234 223 206;
      --color-spiro-rgb: 226 217 204;
      --color-cream-rgb: 255 253 249;
      --color-bg-base: #F7F2EA;         /* Vintage Oatmeal Paper */
      --color-text-base: #221C1A;       /* Deep Charcoal Espresso */
      --color-hero-from: #F7F2EA;
      --color-hero-via: #F7F2EA;
      --color-hero-to: #F7F2EA;
      --color-gradient-from: #B83227;
      --color-gradient-via: #C9392E;
      --color-gradient-to: #96251C;
      --theme-glow: rgba(184, 50, 39, 0.35);
      --theme-glow-soft: rgba(234, 223, 206, 0.9);
    }

    /* Vintage Paper Noise Grain Overlay (Thêm 1 noise để thêm phong cách vintage) */
    .vintage-noise-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99999;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ==========================================================================
       STANDARDIZED EDITORIAL TYPOGRAPHY SYSTEM (ĐỒNG BỘ FONT & TỈ LỆ CHỮ)
       ========================================================================== */
    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background-color: var(--color-bg-base) !important;
      color: var(--color-text-base) !important;
      font-family: 'Google Sans', 'Product Sans', 'Open Sans', system-ui, -apple-system, sans-serif !important;
      font-size: 1rem;
      line-height: 1.6;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Font Family Enforcements */
    h1, h2, h3, .font-serif-vintage, .font-heading, .font-serif {
      font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif !important;
    }
    .font-typewriter, .font-mono {
      font-family: 'Space Mono', monospace, 'Courier New', monospace !important;
    }
    .font-sans {
      font-family: 'Google Sans', 'Product Sans', 'Open Sans', system-ui, -apple-system, sans-serif !important;
    }

    /* Standardized Typography Scale */
    .title-h1 {
      font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif !important;
      font-size: clamp(2.5rem, 5vw, 4.25rem) !important;
      line-height: 1.12 !important;
      font-weight: 700 !important;
      color: #B83227 !important;
      letter-spacing: -0.02em !important;
    }
    .title-h2 {
      font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif !important;
      font-size: clamp(1.85rem, 3.5vw, 2.75rem) !important;
      line-height: 1.2 !important;
      font-weight: 700 !important;
      color: #B83227 !important;
      letter-spacing: -0.015em !important;
    }
    .title-h3 {
      font-family: 'DM Serif Display', 'Playfair Display', Georgia, serif !important;
      font-size: clamp(1.2rem, 2vw, 1.45rem) !important;
      line-height: 1.3 !important;
      font-weight: 700 !important;
    }
    .editorial-p {
      font-family: 'Google Sans', 'Product Sans', 'Open Sans', system-ui, -apple-system, sans-serif !important;
      font-size: 0.95rem !important;
      line-height: 1.7 !important;
      color: rgba(34, 28, 26, 0.85) !important;
      font-weight: 400 !important;
    }
    .editorial-tag {
      font-family: 'Space Mono', monospace, 'Courier New', monospace !important;
      font-size: 0.8rem !important;
      font-weight: 700 !important;
      color: #B83227 !important;
      letter-spacing: 0.04em !important;
    }

    /* Continuous Marquee Ticker */
    @keyframes vintageMarquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    /* Feedback chạy ngang liên tục, rê chuột thì dừng */
    .fb-track { display: flex; width: max-content; animation: vintageMarquee 45s linear infinite; }
    .tpl-track { animation-duration: 35s; }
    .fb-marquee:hover .fb-track, .fb-marquee:focus-within .fb-track { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) { .fb-track { animation-duration: 120s; } }
    /* Ẩn nút Play to của iOS trên clip Hero */
    #top video::-webkit-media-controls-start-playback-button,
    #top video::-webkit-media-controls { display: none !important; -webkit-appearance: none; }
    .animate-vintage-marquee {
      display: flex;
      width: 200%;
      animation: vintageMarquee 26s linear infinite;
    }
    .animate-vintage-marquee:hover {
      animation-play-state: paused;
    }

    /* 35mm Film Strip Reel Styling */
    .film-sprocket-hole {
      width: 14px;
      height: 9px;
      border-radius: 2px;
      background-color: #221C1A;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.7);
      flex-shrink: 0;
    }
    .film-negative-frame {
      position: relative;
      width: 190px;
      height: 125px;
      background-color: #1A1412;
      border-radius: 6px;
      padding: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
      cursor: pointer;
    }
    .film-negative-frame:hover {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
      z-index: 20;
    }
    .camera-flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }
    .camera-flash-overlay.active {
      opacity: 0.92;
      transition: none;
    }

    /* Vintage Offset Photo Outline Box */
    .vintage-offset-card {
      position: relative;
    }
    .vintage-offset-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 1.5px solid #B83227;
      border-radius: inherit;
      transform: translate(8px, 8px);
      pointer-events: none;
      z-index: 0;
    }

    .vintage-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.6rem;
      border-radius: 9999px;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .vintage-pill-btn-outline {
      background-color: #F7F2EA;
      border: 1.5px solid #B83227;
      color: #B83227;
    }
    .vintage-pill-btn-outline:hover {
      background-color: #B83227;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(184, 50, 39, 0.25);
    }
    .vintage-pill-btn-solid {
      background-color: #B83227;
      border: 1.5px solid #B83227;
      color: #FFFFFF;
    }
    .vintage-pill-btn-solid:hover {
      background-color: #96251C;
      border-color: #96251C;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(184, 50, 39, 0.35);
    }

    /* ==========================================================================
       CTA TOUCH HIGHLIGHT & RIPPLE SHIMMER (HIỆU ỨNG CHẠM PHÁT SÁNG NÚT CTA)
       ========================================================================== */
    .cta-highlight {
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgb(var(--color-prussian-rgb) / 0.25);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .cta-highlight::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.45) 50%,
        transparent 70%
      );
      transform: rotate(30deg) translateX(-150%);
      transition: transform 0.65s ease;
      pointer-events: none;
    }

    .cta-highlight:hover::after,
    .cta-highlight:active::after {
      transform: rotate(30deg) translateX(150%);
    }

    .cta-highlight:active,
    .cta-highlight.touch-active {
      transform: scale(0.96) !important;
      box-shadow: 0 0 0 5px var(--theme-glow-soft), 0 0 35px var(--theme-glow) !important;
      filter: brightness(1.12);
    }

    /* ==========================================================================
       PRICE HIGHLIGHTING STYLES (NỔI BẬT MỤC GIÁ & HIỆU ỨNG CHẠM PHÁT SÁNG)
       ========================================================================== */
    .price-tag-highlight {
      background: linear-gradient(135deg, rgb(var(--color-prussian-rgb) / 0.08) 0%, rgb(var(--color-steel-rgb) / 0.18) 100%);
      border: 1.5px solid rgb(var(--color-steel-rgb) / 0.45);
      border-radius: 1rem;
      padding: 0.65rem 0.85rem;
      box-shadow: 0 4px 15px rgb(var(--color-steel-rgb) / 0.12);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .price-tag-highlight:hover,
    .price-tag-highlight:active,
    .price-tag-highlight.touch-active {
      border-color: rgb(var(--color-prussian-rgb));
      background: linear-gradient(135deg, rgb(var(--color-prussian-rgb) / 0.16) 0%, rgb(var(--color-skysoft-rgb) / 0.32) 100%);
      box-shadow: 0 0 30px var(--theme-glow), 0 0 10px rgb(var(--color-skysoft-rgb));
      transform: scale(1.02);
      filter: brightness(1.08);
    }

    /* Breathing Neon Glow Border for Most Popular Package */
    @keyframes borderGlowPulse {
      0%, 100% {
        box-shadow: 0 0 18px var(--theme-glow), 0 0 35px rgb(var(--color-prussian-rgb) / 0.25);
        border-color: rgb(var(--color-prussian-rgb));
      }
      50% {
        box-shadow: 0 0 35px var(--theme-glow-soft), 0 0 60px var(--theme-glow);
        border-color: rgb(var(--color-steel-rgb));
      }
    }

    .popular-card-glow {
      animation: borderGlowPulse 2.8s infinite ease-in-out;
    }

    /* Touch Flash Keyframe Animation */
    @keyframes touchFlash {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.05); filter: brightness(1.25) drop-shadow(0 0 20px var(--theme-glow-soft)); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .touch-flash-glow {
      animation: touchFlash 0.4s ease-out;
    }

    /* Micro-animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.6deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.04); }
    }
    .animate-float {
      animation: floatSlow 6s ease-in-out infinite;
    }
    .animate-pulse-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .glass-luxury {
      background: rgb(var(--color-cream-rgb) / 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgb(var(--color-spiro-rgb) / 0.8);
    }
    .glass-dark {
      background: rgb(var(--color-maastricht-rgb) / 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgb(var(--color-steel-rgb) / 0.3);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgb(var(--color-cream-rgb));
    }
    ::-webkit-scrollbar-thumb {
      background: rgb(var(--color-skysoft-rgb));
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgb(var(--color-steel-rgb));
    }

    /* ==========================================================================
       MOTION SYSTEM: SCROLL REVEAL, POLAROID DEVELOP, PRINTER STRIP, COUNTDOWN
       ========================================================================== */
    /* Chừa chỗ cho header cố định khi cuộn đến từng mục */
    section[id], #faq { scroll-margin-top: 84px; }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* Ảnh "hiện hình" như ảnh lấy liền */
    .develop-photo img {
      filter: sepia(0.9) brightness(1.55) contrast(0.55) saturate(0.4) blur(6px);
      transition: filter 2.2s ease-out 0.2s;
    }
    .develop-photo.is-visible img { filter: none; }

    /* Máy in nhả dải ảnh */
    @keyframes stripPrint {
      0%   { transform: translateY(-100%); }
      15%  { transform: translateY(-86%); }
      19%  { transform: translateY(-86%); }
      37%  { transform: translateY(-62%); }
      41%  { transform: translateY(-62%); }
      59%  { transform: translateY(-38%); }
      63%  { transform: translateY(-38%); }
      82%  { transform: translateY(-12%); }
      86%  { transform: translateY(-12%); }
      100% { transform: translateY(0); }
    }
    .strip-print { animation: stripPrint 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) both; }
    @keyframes stripSway {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.2deg); }
    }
    .strip-sway { transform-origin: top center; animation: stripSway 5s ease-in-out 3.6s infinite; }
    .printer-led {
      width: 9px; height: 9px; border-radius: 9999px;
      background: #4ade80; box-shadow: 0 0 8px #4ade80;
    }
    @keyframes ledBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .printer-led.printing { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; animation: ledBlink 0.45s steps(2) infinite; }

    /* ===== MÁY IN 3D: IN TỪNG TẤM & XÉ ẢNH ===== */
    .printer3d { position: relative; z-index: 20; filter: drop-shadow(0 18px 18px rgba(34, 28, 26, 0.35)); }
    .printer3d-top {
      position: relative; height: 26px; margin: 0 16px;
      background: linear-gradient(180deg, #6a5850 0%, #43362f 100%);
      clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
      border-radius: 6px 6px 0 0;
    }
    .printer3d-top::after {
      content: ''; position: absolute; left: 20%; right: 20%; top: 10px; height: 5px; border-radius: 3px;
      background: #120d0b; box-shadow: inset 0 1px 2px #000, 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .printer3d-front {
      position: relative;
      background: linear-gradient(165deg, #3d322d 0%, #261f1b 55%, #17110f 100%);
      border-radius: 10px 10px 16px 16px;
      padding: 14px 16px 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 -8px 14px rgba(0, 0, 0, 0.55),
                  inset 8px 0 14px rgba(255, 255, 255, 0.03), inset -8px 0 14px rgba(0, 0, 0, 0.35);
      border-bottom: 6px solid #0f0b0a;
    }
    .printer3d-lcd {
      background: linear-gradient(180deg, #1d2a1e, #142015);
      color: #a6f0a6; text-shadow: 0 0 6px rgba(120, 255, 140, 0.55);
      border-radius: 6px; padding: 5px 8px; text-align: center;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .printer3d-grill {
      width: 46px; height: 22px; border-radius: 4px;
      background-image: radial-gradient(circle, #0c0908 1.3px, transparent 1.6px);
      background-size: 6px 6px; opacity: 0.9;
    }
    .printer3d-btn {
      width: 22px; height: 22px; border-radius: 9999px; cursor: pointer; border: none;
      background: radial-gradient(circle at 35% 30%, #e0584b 0%, #B83227 45%, #7d1f17 100%);
      box-shadow: 0 3px 0 #4d120d, 0 4px 6px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .printer3d-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4d120d, inset 0 1px 1px rgba(255, 255, 255, 0.3); }
    .printer3d-slot {
      height: 9px; border-radius: 9999px; background: #050303; margin-top: 12px;
      box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: box-shadow 0.3s;
    }
    .printer3d-slot.active { box-shadow: inset 0 3px 4px rgba(0, 0, 0, 0.95), 0 0 12px 2px rgba(245, 158, 11, 0.55); }

    .photo-card {
      width: 150px; height: 186px; background: #FFFDF9; padding: 8px 8px 0;
      border: 1px solid #E2D9CC; box-sizing: border-box; position: relative;
    }
    .photo-card .photo-img { width: 100%; height: 134px; overflow: hidden; background: #EADFCE; }
    .photo-card .photo-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-card .photo-cap { margin: 0; padding-top: 9px; text-align: center; font-family: 'DM Serif Display', Georgia, serif; font-style: italic; font-size: 13px; color: #B83227; line-height: 1; }
    .photo-card.perforated::before {
      content: ''; position: absolute; left: 0; right: 0; top: 3px;
      border-top: 1.5px dashed rgba(34, 28, 26, 0.3);
    }

    @keyframes photoPrintOut {
      0%   { transform: translateY(-100%); }
      20%  { transform: translateY(-80%); }
      26%  { transform: translateY(-80%); }
      48%  { transform: translateY(-52%); }
      54%  { transform: translateY(-52%); }
      76%  { transform: translateY(-24%); }
      82%  { transform: translateY(-24%); }
      100% { transform: translateY(0); }
    }

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (err) {}
    };

        const dur = 0.22;
        const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.35) * (1 - i / data.length);
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(1800, ctx.currentTime);
        bp.frequency.exponentialRampToValueAtTime(4200, ctx.currentTime + dur);
        const gain = ctx.createGain();
        gain.gain.value = 0.35;
        src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
        src.start();
      } catch (err) {}
    };

    // ===== ẢNH THẬT CỦA AFTER HI (lấy từ Canva) =====
    // Clip boomerang ở Hero (assets/clips/clip-01..19.mp4) – chạy lần lượt hết rồi lặp lại

    function HeroClipPlayer({ clips }) {
      const refs = [React.useRef(null), React.useRef(null)];
      const [slots, setSlots] = React.useState([0, 1 % clips.length]);
      const [active, setActive] = React.useState(0);
      const switching = React.useRef(false);

      // iOS/Zalo/Facebook: React không gắn thuộc tính "muted" vào HTML nên Safari chặn tự phát.
      // Gắn tay muted + playsinline rồi gọi play(); nếu vẫn bị chặn (chế độ tiết kiệm pin…)
      // thì phát ngay ở lần chạm / cuộn đầu tiên của khách.
      React.useEffect(() => {
        refs.forEach((r) => {
          const v = r.current; if (!v) return;
          v.muted = true; v.defaultMuted = true;
          v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        });
        const kick = () => {
          const v = refs[active].current;
          if (v && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
        };
        kick();
        const evs = ['touchstart', 'scroll', 'click', 'keydown'];
        evs.forEach((e) => window.addEventListener(e, kick, { passive: true }));
        const onVis = () => { if (!document.hidden) kick(); };
        document.addEventListener('visibilitychange', onVis);
        return () => {
          evs.forEach((e) => window.removeEventListener(e, kick));
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [active]);

      const next = () => {
        if (switching.current) return;
        switching.current = true;
        const inc = 1 - active;
        const v = refs[inc].current;
        const swap = () => {
          v.removeEventListener('playing', swap);
          setActive(inc);
          const old = refs[active].current;
          if (old) old.pause();
          // thẻ vừa hết → nạp clip sau nữa để chờ sẵn
          setSlots((sl) => {
            const n = [...sl];
            n[active] = (sl[inc] + 1) % clips.length;
            return n;
          });
          switching.current = false;
        };
        if (!v) { switching.current = false; return; }
        v.currentTime = 0;
        v.addEventListener('playing', swap);
        const p = v.play();
        if (p && p.catch) p.catch(() => { v.removeEventListener('playing', swap); switching.current = false; });
      };

              ref={refs[k]}

              muted playsInline preload="auto"

            />

          </span>
        </>

    const HOLIDAY_LEAD_DAYS = 30; // kích hoạt trước ngày lễ bao nhiêu ngày

    const holidayDateFor = (h, year) => {
      if (h.lunar) {
        const v = LUNAR_DATES[h.lunar][year];
        return v ? new Date(year, v[0] - 1, v[1]) : null;
      }
      return new Date(year, h.month - 1, h.day);
    };
    const fillHolidayText = (str, year) => (str || '').replace(/\{y\}/g, year).replace(/\{canchi\}/g, CAN_CHI[year] || '');

    function getActiveHoliday(now) {
      let force = null;
      try { force = new URLSearchParams(window.location.search).get('le'); } catch (err) {}
      if (force === 'off') return null;
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const candidates = [];
      HOLIDAYS.forEach(h => {
        [today.getFullYear() - 1, today.getFullYear(), today.getFullYear() + 1].forEach(y => {
          const d = holidayDateFor(h, y);
          if (!d) return;
          const days = Math.round((d - today) / DAY_MS);
          const inWindow = days <= HOLIDAY_LEAD_DAYS && days >= -(h.after || 0);
          const forced = force === h.id && days >= -(h.after || 0);
          if (force ? forced : inWindow) candidates.push({ h, d, days });
        });
      });
      if (!candidates.length) return null;
      // Ưu tiên dịp đang diễn ra, sau đó là dịp gần nhất sắp tới
      candidates.sort((a, b) => (a.days <= 0 ? -1000 + a.days : a.days) - (b.days <= 0 ? -1000 + b.days : b.days));
      const { h, d, days } = candidates[0];
      const y = d.getFullYear();
      return {
        ...h, date: d, days,
        title: fillHolidayText(h.title, y), sub: fillHolidayText(h.sub, y),
        heroTag: fillHolidayText(h.heroTag, y), caps: h.caps.map(c => fillHolidayText(c, y))
      };
    }

    const drawStar = (ctx, r, color) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rad = i % 2 ? r * 0.45 : r;
        const a = (Math.PI / 5) * i - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
    };

    function SeasonalParticles({ kind }) {
      const ref = React.useRef(null);
      useEffect(() => {
        const cfg = PARTICLE_KINDS[kind];
        const c = ref.current;
        if (!cfg || !c || prefersReducedMotion()) return;
        const ctx = c.getContext('2d');
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        let w = 0, h = 0, raf;
        const resize = () => {
          w = c.width = window.innerWidth * dpr;
          h = c.height = window.innerHeight * dpr;
          c.style.width = window.innerWidth + 'px';
          c.style.height = window.innerHeight + 'px';
        };
        resize();
        window.addEventListener('resize', resize);
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const make = (initial) => {
          const useGlyph = cfg.glyphs && (cfg.glyphChance === undefined || Math.random() < cfg.glyphChance);
          return {
            x: Math.random() * w,
            y: initial ? Math.random() * h : (cfg.rise ? h + 30 * dpr : -30 * dpr),
            s: (cfg.min + Math.random() * (cfg.max - cfg.min)) * dpr,
            vy: cfg.speed * (0.6 + Math.random() * 0.8) * dpr * (cfg.rise ? -1 : 1),
            vx: (Math.random() - 0.5) * 0.4 * dpr,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.04,
            sway: Math.random() * Math.PI * 2,
            glyph: useGlyph ? pick(cfg.glyphs) : null,
            color: cfg.colors ? pick(cfg.colors) : '#B83227'
          };
        };
        const count = window.innerWidth < 640 ? 18 : 34;
        const parts = Array.from({ length: count }, () => make(true));
        const draw = () => {
          ctx.clearRect(0, 0, w, h);
          parts.forEach((p, i) => {
            p.sway += 0.02;
            p.x += p.vx + Math.sin(p.sway) * 0.35 * dpr;
            p.y += p.vy;
            p.rot += p.vr;
            const out = cfg.rise ? p.y < -40 * dpr : p.y > h + 40 * dpr;
            if (out || p.x < -50 * dpr || p.x > w + 50 * dpr) { parts[i] = make(false); return; }
            ctx.save();
            ctx.translate(p.x, p.y);
            if (cfg.spin) ctx.rotate(p.rot);
            ctx.globalAlpha = 0.8;
            if (p.glyph) {
              ctx.font = `${p.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = p.color;
              ctx.fillText(p.glyph, 0, 0);
            } else if (cfg.shape === 'dot') {
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(0, 0, p.s / 4, 0, Math.PI * 2);
              ctx.fill();
            } else if (cfg.shape === 'confetti') {
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.s / 4, -p.s / 8, p.s / 2, p.s / 4);
            } else if (cfg.shape === 'star') {
              drawStar(ctx, p.s / 3, p.color);
            }
            ctx.restore();
          });
          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
      }, [kind]);
      if (!PARTICLE_KINDS[kind]) return null;
      return <canvas ref={ref} className="seasonal-canvas" aria-hidden="true" />;
    }

    const NOTE_INDEX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };

      const m = /^([A-G][#b]?)(\d)$/.exec(n);

      const midi = (parseInt(m[2], 10) + 1) * 12 + NOTE_INDEX[m[1]];

    class SeasonSynth {
      constructor(songKeys, onChange) {
        this.list = (Array.isArray(songKeys) ? songKeys : [songKeys]).filter(k => SONGS[k]);
        if (!this.list.length) this.list = ['jingle'];

      next() {

        this.buses = [];
        this.si = (this.si + 1) % this.list.length;
        this.load();
        if (!this.playing) return;
        this.i = 0;

      ensureCtx() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        if (!this.ctx) {
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.3;
          this.master.connect(this.ctx.destination);
          const len = Math.floor(this.ctx.sampleRate * 0.3);
          this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const d = this.noise.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return true;
      }
      tone(f, t, dur) {
        const ctx = this.ctx, v = this.song.voice;
        const g = ctx.createGain();
        g.connect(this.master);
        const o = ctx.createOscillator();
        let end = t + dur;
        if (v === 'bell' || v === 'box') {
          o.type = 'sine';
          o.frequency.value = f;
          const o2 = ctx.createOscillator(), g2 = ctx.createGain();
          o2.type = 'sine';
          o2.frequency.value = f * (v === 'bell' ? 2.76 : 3);
          g2.gain.value = v === 'bell' ? 0.25 : 0.12;
          o2.connect(g2); g2.connect(g);
          end = t + Math.max(0.7, dur * 1.5);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.32, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, end);
          o2.start(t); o2.stop(end + 0.05);
        } else if (v === 'pluck') {
          o.type = 'triangle';
          o.frequency.setValueAtTime(f * 1.012, t);
          o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
          end = t + Math.max(0.5, dur * 1.2);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.4, t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, end);
        } else if (v === 'brass') {
          o.type = 'sawtooth';
          o.frequency.value = f;
          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 1400;
          o.connect(lp); lp.connect(g);
          end = t + dur * 0.9;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.13, t + 0.03);
          g.gain.setValueAtTime(0.11, end - 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, end);
          o.start(t); o.stop(end + 0.05);
          return;
        } else {
          o.type = 'triangle';
          o.frequency.value = f;
          const lfo = ctx.createOscillator(), lg = ctx.createGain();
          lfo.frequency.value = 5.5;
          lg.gain.value = f * 0.02;
          lfo.connect(lg); lg.connect(o.frequency);
          end = t + dur * 1.1;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.3, t + 0.06);
          g.gain.exponentialRampToValueAtTime(0.0001, end);
          lfo.start(t); lfo.stop(end + 0.05);
        }
        o.connect(g);
        o.start(t); o.stop(end + 0.05);

      hit(kind, t, freq, dur, gain, filterType) {
        const ctx = this.ctx;
        const src = ctx.createBufferSource();
        src.buffer = this.noise;

      kick(t, gain) {

        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.setValueAtTime(120, t);
        o.frequency.exponentialRampToValueAtTime(45, t + 0.15);

        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.22);

      bassNote(bus, f, t, dur) {
        const ctx = this.ctx;
        const o = ctx.createOscillator(), g = ctx.createGain();

          lp.frequency.value = 420;
          o.connect(lp); lp.connect(g);

          o.connect(g);
        }
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(this.song.bassVoice === 'tuba' ? 0.22 : 0.4, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        g.connect(bus);
        o.start(t); o.stop(t + dur + 0.05);

      stab(bus, f, t, dur) {
        const ctx = this.ctx;
        const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        o.type = 'sawtooth';
        o.frequency.value = f;
        lp.type = 'lowpass';
        lp.frequency.value = 1800;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.045, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(lp); lp.connect(g); g.connect(bus);
        o.start(t); o.stop(t + dur + 0.05);
      }
      // Lên lịch bass + hợp âm cho cả một vòng giai điệu
      scheduleChords(t0) {
        if (!this.chords) return;
        const spb = 60 / this.song.bpm;
        const bus = this.ctx.createGain();
        bus.connect(this.master);
        this.buses.push(bus);
        if (this.buses.length > 3) this.buses.shift();
        let t = t0;
        this.chords.forEach(([root, minor, beats]) => {
          for (let b = 0; b < beats; b++) {
            const bt = t + b * spb;
            if (b % 2 === 0) this.bassNote(bus, b % 4 === 2 ? root * 1.5 : root, bt, spb * 0.9);
            else if (this.song.stabs) [0, minor ? 3 : 4, 7].forEach(st => this.stab(bus, root * 4 * Math.pow(2, st / 12), bt, spb * 0.4));
            else this.bassNote(bus, root * 2 * Math.pow(2, (minor ? 3 : 4) / 12), bt, spb * 0.5);
          }
          t += beats * spb;
        });
      }
      perc(t, beat) {
        const p = this.song.perc;
        if (p === 'sleigh') this.hit('s', t, 7000, 0.06, beat % 2 ? 0.05 : 0.09, 'highpass');
        else if (p === 'drum') {
          if (beat % 4 === 0) this.kick(t, 0.35);
          if (beat % 2 === 1) this.hit('w', t, 1600, 0.05, 0.12, 'bandpass');
        } else if (p === 'lion') {
          // Trống múa lân: tùng – tùng – tùng cắc, chũm chọe nhẹ
          const k = beat % 8;
          if (k === 0 || k === 2 || k === 4) this.kick(t, 0.38);
          if (k === 3 || k === 6 || k === 7) this.hit('w', t, 2400, 0.07, 0.14, 'bandpass');
          if (k % 2 === 1) this.hit('c', t, 6500, 0.14, 0.05, 'highpass');
        } else if (p === 'snare') {
          if (beat % 2 === 0) this.kick(t, 0.3);
          else this.hit('sn', t, 2000, 0.12, 0.16, 'bandpass');
        }

      start() {
        if (this.playing || !this.ensureCtx()) return;
        this.playing = true;
        this.i = 0;
        this.t = this.ctx.currentTime + 0.15;
        this.beatT = this.t;
        this.beat = 0;
        this.tick();
      }
      tick() {
        if (!this.playing) return;
        const spb = 60 / this.song.bpm;
        const ahead = this.ctx.currentTime + 0.4;
        while (this.t < ahead) {
          if (this.i === 0) this.scheduleChords(this.t);
          const [f, b] = this.notes[this.i];
          const dur = b * spb;
          if (f) this.tone(f, this.t, dur);
          this.t += dur;
          this.i++;
          if (this.i >= this.notes.length) {
            this.i = 0;
            this.t += spb * (this.song.rest || 0);
            this.loops++;

            if (this.list.length > 1 && this.loops >= (this.song.repeat || 2)) {

              this.load();
              this.t += 0.6;
              this.beatT = this.t;
              this.beat = 0;
              break;
            }
          }
        }
        if (this.song.perc) {
          const step = (this.song.perc === 'sleigh' || this.song.perc === 'lion') ? spb / 2 : spb;
          while (this.beatT < ahead) { this.perc(this.beatT, this.beat); this.beatT += step; this.beat++; }
        }
        this.timer = setTimeout(() => this.tick(), 100);
      }

        this.playing = false;
        clearTimeout(this.timer);
        this.buses.forEach(b => { try { b.disconnect(); } catch (err) {} });
        this.buses = [];
        if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
      }
    }

    // Số đếm tăng dần khi cuộn tới
    function CountUp({ end, duration = 1400, suffix = '' }) {
      const ref = React.useRef(null);
      const [val, setVal] = useState(0);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (prefersReducedMotion() || !('IntersectionObserver' in window)) { setVal(end); return; }
        let raf;
        const io = new IntersectionObserver(([entry]) => {
          if (!entry.isIntersecting) return;
          io.disconnect();
          const t0 = performance.now();
          const tick = (t) => {
            const p = Math.min(1, (t - t0) / duration);
            setVal(Math.round(end * (1 - Math.pow(1 - p, 3))));
            if (p < 1) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
        }, { threshold: 0.4 });
        io.observe(el);
        return () => { io.disconnect(); cancelAnimationFrame(raf); };
      }, [end]);
      return <span ref={ref}>{val}{suffix}</span>;
    }

    // Số tiền lăn mượt khi thay đổi
    function useAnimatedNumber(target, duration = 600) {
      const [display, setDisplay] = useState(target);
      const fromRef = React.useRef(target);
      useEffect(() => {
        const from = fromRef.current;
        if (from === target) return;
        if (prefersReducedMotion()) { fromRef.current = target; setDisplay(target); return; }
        let raf;
        const t0 = performance.now();
        const tick = (t) => {
          const p = Math.min(1, (t - t0) / duration);
          const v = p < 1 ? Math.round((from + (target - from) * (1 - Math.pow(1 - p, 3))) / 1000) * 1000 : target;
          fromRef.current = v;
          setDisplay(v);
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [target]);
      return display;
    }
